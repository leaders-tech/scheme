# This workflow verifies and publishes the installable Schemio playground package.
# Edit it when the package name, publish registry, or release tag format changes.
# Copy its verify-then-publish pattern for another small npm package in this repository.
name: Schemio playground package

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/schemio-playground-package.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/schemio-playground-package.yml"
    tags:
      - "schemio-playground-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install package development dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build the web component
        working-directory: frontend
        run: npm run build:playground
      - name: Check that the tracked bundle is current
        run: git diff --exit-code -- frontend/embed-dist
      - name: Check that a release tag names this package version
        if: startsWith(github.ref, 'refs/tags/schemio-playground-v')
        shell: bash
        run: |
          expected="schemio-playground-v$(node -p 'require("./frontend/package.json").version')"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Create browser release archive
        shell: bash
        run: |
          set -euxo pipefail
          version="$(node -p 'require("./frontend/package.json").version')"
          archive_dir="schemio-playground-${version}-browser"
          mkdir "$archive_dir"
          cp -R frontend/embed-dist/. "$archive_dir/"
          cp frontend/browser-release-README.md "$archive_dir/README.md"
          test -f "$archive_dir/schemio-playground.js"
          test -d "$archive_dir/chunks"
          find "$archive_dir/chunks" -type f -name '*.js' -print -quit | grep -q .
          tar -czf "$archive_dir.tar.gz" "$archive_dir"
          sha256sum "$archive_dir.tar.gz" > "$archive_dir.tar.gz.sha256"
      - name: Upload browser release archive
        uses: actions/upload-artifact@v4
        with:
          name: schemio-playground-browser-release
          path: |
            schemio-playground-*-browser.tar.gz
            schemio-playground-*-browser.tar.gz.sha256
      - name: Pack the exact npm package
        working-directory: frontend
        run: |
          mkdir -p ../package-artifact
          npm pack --pack-destination ../package-artifact
      - name: Install the package with pnpm
        shell: bash
        run: |
          mkdir package-consumer
          cd package-consumer
          pnpm init
          pnpm add ../package-artifact/*.tgz
          test -f node_modules/@leaders-tech/schemio-playground/embed-dist/schemio-playground.js
          test -n "$(find node_modules/@leaders-tech/schemio-playground/embed-dist/chunks -name '*.js' -print -quit)"

  publish:
    if: startsWith(github.ref, 'refs/tags/schemio-playground-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install package development dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the web component
        working-directory: frontend
        run: npm run build:playground
      - name: Check that the tracked bundle is current
        run: git diff --exit-code -- frontend/embed-dist
      - name: Publish to npm
        working-directory: frontend
        run: npm publish --access public

  browser-release:
    if: startsWith(github.ref, 'refs/tags/schemio-playground-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: schemio-playground-browser-release
          path: release-files
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -o pipefail
          mapfile -t files < <(find release-files -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) | sort)
          test "${#files[@]}" -eq 2
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes
          fi
