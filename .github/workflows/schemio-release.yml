# This workflow tests and releases Schemio binaries for its supported platforms.
# Edit it when release targets, archive names, or GitHub Release behavior changes.
# Copy this matrix pattern when another standalone project needs tagged releases.
name: Release Schemio

on:
  push:
    tags:
      - "schemio-v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
          - name: Ubuntu x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test Schemio
        run: cargo test --manifest-path schemio/Cargo.toml
      - name: Build release binary
        run: cargo build --release --manifest-path schemio/Cargo.toml --target ${{ matrix.target }}
      - name: Package release archive
        shell: bash
        run: |
          artifact="schemio-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$artifact"
          cp "schemio/target/${{ matrix.target }}/release/schemio" "$artifact/"
          cp schemio/README.md "$artifact/"
          tar -czf "$artifact.tar.gz" "$artifact"
          shasum -a 256 "$artifact.tar.gz" > "$artifact.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: schemio-${{ matrix.target }}
          path: |
            schemio-*.tar.gz
            schemio-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mapfile -t files < <(find release-files -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) | sort)
          test "${#files[@]}" -eq 4
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" --generate-notes 2>&1 | tee release-output.txt
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 20 release-output.txt | tr '\n' ' ')"
            echo "::error title=GitHub Release failed::$summary"
            exit "$status"
          fi
