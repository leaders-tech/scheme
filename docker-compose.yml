# This file connects the frontend and backend containers for tlfpaas autodeploy.
# Edit this file when public deploy services, routes, or persistent volumes change.
# Copy a service block here when you add another tlfpaas service.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_MODE: ${APP_MODE:-prod}
      APP_HOST: 0.0.0.0
      APP_PORT: 8081
      DB_PATH: /data/app.sqlite3
      COOKIE_SECRET: ${COOKIE_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://scheme.tlfedu.tech}
    expose:
      - "8081"
    labels:
      tlfpaas.route: "backend"
    volumes:
      - sqlite_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    expose:
      - "8080"
    labels:
      tlfpaas.route: "frontend"

volumes:
  sqlite_data:
